<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Truco Night Tracker - Estilo Argentino</title>

    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #064e3b;
        }

        .truco-table {
            background: #065f46;
            border: 8px solid #451a03;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
        }

        .score-font {
            font-family: 'Playfair Display', serif;
        }

        .pica-badge {
            background-color: #064e3b;
            border: 1px solid #10b981;
        }

        .ba-label {
            display: inline;
            font-size: 9px;
            font-weight: 400;
            line-height: 1;
            vertical-align: middle;
            margin-left: 4px;
            padding: 0;
            border: 0;
            border-radius: 0;
            position: static;
            transform: none;
        }

        button {
            touch-action: manipulation;
        }

        /* =========================
           MODO EDICIÓN
        ========================= */

        .edit-mode {
            outline: 2px dashed #f59e0b !important;
            outline-offset: 3px;
            cursor: text !important;
        }

        .editable-field {
            cursor: text;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .editable-field:hover {
            background: rgba(245,158,11,0.15);
        }

        .editable-field:focus {
            outline: 2px solid #f59e0b;
            background: rgba(0,0,0,0.25);
        }

        .edit-only {
            display: none;
        }

        body.editing .edit-only {
            display: block;
        }

        body.editing .normal-only {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

<div class="max-w-md w-full relative pt-2 pb-24" id="app">

    <!-- =========================
         BOTÓN DESHACER
    ========================== -->

    <button
        id="undo-btn"
        onclick="undo(); vibrar();"
        class="fixed bottom-6 right-4 sm:right-8 z-[90] flex items-center space-x-1.5 px-4 py-2.5 text-emerald-100 bg-emerald-800/95 backdrop-blur-sm border border-emerald-600 rounded-full hover:bg-emerald-700 transition-all duration-300 opacity-0 pointer-events-none translate-y-4 shadow-2xl"
        title="Deshacer última acción"
    >
        <svg xmlns="http://www.w3.org/2000/svg"
             width="16"
             height="16"
             viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2.5"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M3 7v6h6"/>
            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
        </svg>
        <span class="text-[11px] font-bold uppercase tracking-wider">Deshacer</span>
    </button>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="text-center mb-6 mt-4 relative">
        <h1 class="text-4xl font-bold text-amber-500 score-font drop-shadow-md">
            Noche de Truco
        </h1>

        <p class="text-emerald-100 opacity-80">
            Pica Pica Profesional
        </p>
    </header>

    <!-- =========================
         TABS
    ========================== -->

    <div class="flex space-x-2 mb-6 bg-emerald-950 p-1 rounded-xl shadow-inner border border-emerald-800">

        <button
            onclick="switchTab('play'); vibrar();"
            id="tab-play"
            class="flex-1 py-2 font-semibold rounded-lg bg-emerald-700 text-white shadow-lg transition-all"
        >
            Partidas
        </button>

        <button
            onclick="switchTab('stats'); vibrar();"
            id="tab-stats"
            class="flex-1 py-2 font-semibold rounded-lg text-emerald-200 hover:bg-emerald-800 transition-all"
        >
            Ranking
        </button>

    </div>

    <!-- =========================================================
         PARTIDAS
    ========================================================== -->

    <div id="section-play" class="space-y-6">

        <div id="active-matches-container" class="space-y-4"></div>

        <button
            onclick="cerrarTodosLosChicos();"
            class="w-full bg-blue-900/80 text-blue-300 py-3 rounded-xl font-bold border border-blue-700/50 hover:bg-blue-800 transition-all shadow-lg mt-6 mb-2"
        >
            Cerrar Chico (Todos los enfrentamientos)
        </button>

        <!-- NUEVA PARTIDA -->

        <div class="bg-emerald-800 p-6 rounded-2xl shadow-xl border border-emerald-700 mt-4">

            <h2 class="text-lg font-bold text-white mb-4">
                Nueva partida
            </h2>

            <div class="grid grid-cols-2 gap-4">

                <input
                    list="players-1"
                    type="text"
                    id="p1"
                    placeholder="Jugador 1"
                    class="w-full p-3 bg-emerald-900 border-none text-white rounded-lg placeholder-emerald-500 focus:ring-2 focus:ring-amber-500 outline-none"
                    oninput="updateDatalists()"
                >

                <datalist id="players-1"></datalist>

                <input
                    list="players-2"
                    type="text"
                    id="p2"
                    placeholder="Jugador 2"
                    class="w-full p-3 bg-emerald-900 border-none text-white rounded-lg placeholder-emerald-500 focus:ring-2 focus:ring-amber-500 outline-none"
                    oninput="updateDatalists()"
                >

                <datalist id="players-2"></datalist>

            </div>

            <button
                onclick="startMatch(); vibrar();"
                class="w-full mt-4 bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-700 transition-colors shadow-lg shadow-amber-900/50"
            >
                Empezar Duelo
            </button>

        </div>

        <button
            onclick="resetEverything(); vibrar();"
            class="w-full bg-emerald-950 text-emerald-500 py-2 rounded-xl font-bold border border-emerald-900 hover:bg-emerald-900 transition-all text-xs uppercase tracking-widest mt-2"
        >
            Empezar nueva noche de truco
        </button>

    </div>

    <!-- =========================================================
         ESTADÍSTICAS
    ========================================================== -->

    <div id="section-stats" class="hidden space-y-6">

        <!-- =========================
             BOTÓN EDIT ON/OFF
        ========================== -->

        <div class="flex gap-2">

            <button
                id="edit-toggle-btn"
                onclick="toggleEditMode(); vibrar();"
                class="flex-1 bg-amber-600 text-white py-3 rounded-xl font-bold hover:bg-amber-700 transition-all shadow-lg"
            >
                ✏️ EDIT ON
            </button>

            <button
                id="save-edit-btn"
                onclick="finishEditMode(); vibrar();"
                class="hidden flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold hover:bg-emerald-500 transition-all shadow-lg"
            >
                ✓ EDIT OFF
            </button>

        </div>

        <div
            id="edit-help"
            class="hidden bg-amber-950/70 border border-amber-700 text-amber-200 rounded-xl p-3 text-xs text-center"
        >
            Modo edición activo. Pulsa sobre cualquier dato para modificarlo.
        </div>

        <!-- =========================
             RESULTADOS DE ESTA NOCHE
        ========================== -->

        <div
            id="capture-area"
            class="bg-emerald-800 p-3 rounded-2xl shadow-xl border border-emerald-700 space-y-2 relative"
        >

            <h2 class="text-xl font-bold text-amber-400 score-font text-center drop-shadow-md pb-1.5 border-b border-emerald-700/50">
                Resultados Pica Pica
            </h2>

            <div class="pt-1">

                <h2 class="text-xs font-bold text-emerald-300 mb-1.5 border-b border-emerald-700 pb-1 text-center uppercase tracking-widest">
                    PUNTOS DE ESTA NOCHE
                </h2>

                <div class="flex justify-between px-2 mb-1 mt-1 text-[9px] font-bold text-emerald-500 uppercase tracking-wider">

                    <div class="flex-1 ml-6">
                        Jugador
                    </div>

                    <div class="flex w-24 justify-between text-center">
                        <span class="w-6 text-emerald-400">G</span>
                        <span class="w-6 text-red-400">P</span>
                        <span class="w-8 text-blue-400">DIF</span>
                    </div>

                </div>

                <div
                    id="stats-list-combined"
                    class="grid grid-cols-1 gap-1"
                ></div>

            </div>

            <!-- ENFRENTAMIENTOS -->

            <div class="pt-1">

                <h2 class="text-xs font-bold text-emerald-300 mb-1.5 border-b border-emerald-700 pb-1 text-center uppercase tracking-widest">
                    ENFRENTAMIENTOS
                </h2>

                <div
                    id="history-list"
                    class="space-y-1.5 mt-1"
                ></div>

            </div>

        </div>

        <button
            onclick="shareStats(); vibrar();"
            class="w-full mt-2 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg"
        >
            📸 Compartir Noche
        </button>

        <!-- =========================
             HISTÓRICO
        ========================== -->

        <div class="mt-8 pt-6 border-t border-emerald-800/50">

            <button
                onclick="confirmarRegistroNoche(); vibrar();"
                class="w-full bg-amber-700 text-amber-100 py-3 rounded-xl font-bold border border-amber-600 hover:bg-amber-600 transition-all shadow-lg mb-6 uppercase tracking-wider text-sm flex items-center justify-center gap-2"
            >
                Registrar Noche en Histórico
            </button>

            <div
                id="capture-area-history"
                class="bg-[#043d2e] p-3 rounded-2xl shadow-xl border border-emerald-900 space-y-2 relative"
            >

                <h2 class="text-xl font-bold text-amber-500 score-font text-center drop-shadow-md pb-1.5 border-b border-emerald-800/80">
                    Tabla Histórica Anual
                </h2>

                <div class="pt-1">

                    <h2 class="text-[10px] font-bold text-emerald-400 mb-1.5 border-b border-emerald-800 pb-1 text-center uppercase tracking-widest">
                        PUNTOS ACUMULADOS EN PICA PICAS
                    </h2>

                    <div class="flex justify-between px-2 mb-1 mt-1 text-[9px] font-bold text-emerald-600 uppercase tracking-wider">

                        <div class="flex-1 ml-6">
                            Jugador
                        </div>

                        <div class="flex w-24 justify-between text-center">
                            <span class="w-6">G</span>
                            <span class="w-6">P</span>
                            <span class="w-8">DIF</span>
                        </div>

                    </div>

                    <div
                        id="historical-stats-list"
                        class="grid grid-cols-1 gap-1"
                    ></div>

                </div>

            </div>

            <button
                onclick="shareHistoricalStats(); vibrar();"
                class="w-full mt-4 bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition-colors shadow-lg"
            >
                📸 Compartir Histórico
            </button>

        </div>

    </div>

    <!-- =========================
         BACKUP
    ========================== -->

    <div class="mt-12 pt-6 border-t border-emerald-900 flex gap-3">

        <button
            onclick="exportBackup(); vibrar();"
            class="flex-1 bg-emerald-950 text-emerald-400 py-2.5 rounded-lg font-bold border border-emerald-800 hover:bg-emerald-900 transition-all text-xs uppercase tracking-widest"
        >
            Guardar Backup
        </button>

        <button
            onclick="document.getElementById('backup-input').click(); vibrar();"
            class="flex-1 bg-emerald-950 text-emerald-400 py-2.5 rounded-lg font-bold border border-emerald-800 hover:bg-emerald-900 transition-all text-xs uppercase tracking-widest"
        >
            Cargar Backup
        </button>

        <input
            type="file"
            id="backup-input"
            class="hidden"
            accept=".json"
            onchange="importBackup(event)"
        >

    </div>

</div>

<!-- =========================================================
     MODAL
========================================================== -->

<div
    id="custom-modal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 backdrop-blur-sm px-4 opacity-0 transition-opacity duration-300"
>

    <div
        class="bg-emerald-950 border-2 border-emerald-600 rounded-2xl shadow-2xl p-6 max-w-sm w-full text-center transform scale-95 transition-transform duration-300"
        id="modal-content"
    >

        <p
            id="modal-message"
            class="text-emerald-50 mb-6 text-sm font-semibold leading-relaxed"
        ></p>

        <div
            class="flex justify-center gap-3"
            id="modal-buttons"
        ></div>

    </div>

</div>

<script>

    /* =========================================================
       ESTADO
    ========================================================== */

    let gameState = {
        activeMatches: [],
        knownPlayers: []
    };

    let historyStack = [];

    let historicalStats = {};

    let editMode = false;


    /* =========================================================
       VIBRACIÓN
    ========================================================== */

    function vibrar() {
        if (navigator.vibrate) {
            navigator.vibrate(120);
        }
    }

    function vibrarFuerte() {
        if (navigator.vibrate) {
            navigator.vibrate([180, 70, 180]);
        }
    }


    /* =========================================================
       MODAL
    ========================================================== */

    function showModal(
        message,
        type,
        onConfirmCallback = null,
        customConfirmText = "Confirmar",
        customCancelText = "Cancelar"
    ) {

        const modal = document.getElementById('custom-modal');
        const modalContent = document.getElementById('modal-content');
        const msgEl = document.getElementById('modal-message');
        const btnsEl = document.getElementById('modal-buttons');

        msgEl.innerHTML = message;

        btnsEl.innerHTML = '';

        btnsEl.className = "flex justify-center gap-3";

        if (type === 'alert') {

            const btn = document.createElement('button');

            btn.className =
                "bg-amber-600 text-white px-8 py-2.5 rounded-xl font-bold hover:bg-amber-700 transition-colors shadow-lg shadow-amber-900/50 w-full";

            btn.textContent = "Entendido";

            btn.onclick = closeModal;

            btnsEl.appendChild(btn);

        } else if (type === 'confirm') {

            const cancelBtn = document.createElement('button');

            cancelBtn.className =
                "flex-1 bg-emerald-900 text-emerald-200 px-4 py-2.5 rounded-xl font-bold hover:bg-emerald-800 transition-colors border border-emerald-700";

            cancelBtn.textContent = customCancelText;

            cancelBtn.onclick = closeModal;


            const confirmBtn = document.createElement('button');

            confirmBtn.className =
                "flex-1 bg-amber-600 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-amber-700 transition-colors shadow-lg shadow-amber-900/50";

            confirmBtn.textContent = customConfirmText;

            confirmBtn.onclick = () => {

                closeModal();

                if (onConfirmCallback) {
                    onConfirmCallback();
                }

            };

            btnsEl.appendChild(cancelBtn);
            btnsEl.appendChild(confirmBtn);
        }

        modal.classList.remove('hidden');
        modal.classList.add('flex');

        setTimeout(() => {

            modal.classList.remove('opacity-0');
            modal.classList.add('opacity-100');

            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');

        }, 10);
    }


    function closeModal() {

        const modal = document.getElementById('custom-modal');

        const modalContent =
            document.getElementById('modal-content');

        modal.classList.remove('opacity-100');
        modal.classList.add('opacity-0');

        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');

        setTimeout(() => {

            modal.classList.add('hidden');
            modal.classList.remove('flex');

        }, 300);
    }


    /* =========================================================
       LOCAL STORAGE
    ========================================================== */

    function saveToLocalStorage() {

        localStorage.setItem(
            'truco_pica_pica_state',
            JSON.stringify(gameState)
        );

        localStorage.setItem(
            'truco_pica_pica_history',
            JSON.stringify(historyStack)
        );

        localStorage.setItem(
            'truco_pica_pica_historical_stats',
            JSON.stringify(historicalStats)
        );
    }


    function loadFromLocalStorage() {

        try {

            const savedState =
                localStorage.getItem('truco_pica_pica_state');

            if (savedState) {

                gameState = JSON.parse(savedState);

                if (!gameState.knownPlayers) {
                    gameState.knownPlayers = [];
                }

                if (!gameState.activeMatches) {
                    gameState.activeMatches = [];
                }
            }

            const savedHistory =
                localStorage.getItem('truco_pica_pica_history');

            if (savedHistory) {
                historyStack = JSON.parse(savedHistory);
            }

            const savedHistorical =
                localStorage.getItem(
                    'truco_pica_pica_historical_stats'
                );

            if (savedHistorical) {
                historicalStats = JSON.parse(savedHistorical);
            }

        } catch (error) {

            console.error(error);

            gameState = {
                activeMatches: [],
                knownPlayers: []
            };

            historyStack = [];
            historicalStats = {};
        }

        renderMatches();
        renderStats();
        renderHistoricalStats();
        updateUndoButton();
    }


    /* =========================================================
       BACKUP
    ========================================================== */

    function exportBackup() {

        const backupData = {
            version: "2.0",
            timestamp: new Date().toISOString(),
            state: gameState,
            history: historyStack,
            historicalStats: historicalStats
        };

        const jsonStr = JSON.stringify(
            backupData,
            null,
            2
        );

        const blob =
            new Blob(
                [jsonStr],
                { type: "application/json" }
            );

        const url =
            URL.createObjectURL(blob);

        const anchor =
            document.createElement('a');

        anchor.href = url;
        anchor.download = "PICA_PICA.json";

        document.body.appendChild(anchor);

        anchor.click();

        document.body.removeChild(anchor);

        URL.revokeObjectURL(url);

        showModal(
            "Backup guardado correctamente.<br><br><b>PICA_PICA.json</b>",
            "alert"
        );
    }


    function importBackup(event) {

        const file =
            event.target.files[0];

        if (!file) return;

        const reader =
            new FileReader();

        reader.onload = function(e) {

            try {

                const importedData =
                    JSON.parse(e.target.result);

                if (
                    importedData.state &&
                    importedData.state.activeMatches
                ) {

                    showModal(
                        "¿Estás seguro de cargar este backup?<br><br>Se sobrescribirán los datos actuales.",
                        "confirm",
                        () => {

                            gameState =
                                importedData.state;

                            historyStack =
                                importedData.history || [];

                            historicalStats =
                                importedData.historicalStats || {};

                            saveToLocalStorage();

                            renderMatches();
                            renderStats();
                            renderHistoricalStats();
                            updateUndoButton();

                            showModal(
                                "Backup cargado correctamente.",
                                "alert"
                            );

                        },
                        "Sí, Cargar",
                        "Cancelar"
                    );

                } else {

                    showModal(
                        "El archivo no parece ser un backup válido.",
                        "alert"
                    );
                }

            } catch (error) {

                showModal(
                    "Error al leer el archivo JSON.",
                    "alert"
                );
            }
        };

        reader.readAsText(file);

        event.target.value = "";
    }


    /* =========================================================
       DATALISTS
    ========================================================== */

    function updateDatalists() {

        const p1Val =
            document.getElementById('p1').value.trim();

        const p2Val =
            document.getElementById('p2').value.trim();

        const activePlayers =
            gameState.activeMatches.flatMap(
                m => [m.p1, m.p2]
            );

        const available =
            gameState.knownPlayers.filter(
                p => !activePlayers.includes(p)
            );

        document.getElementById('players-1').innerHTML =
            available
                .filter(p => p !== p2Val)
                .map(p => `<option value="${escapeHtml(p)}">`)
                .join('');

        document.getElementById('players-2').innerHTML =
            available
                .filter(p => p !== p1Val)
                .map(p => `<option value="${escapeHtml(p)}">`)
                .join('');
    }


    /* =========================================================
       ESCAPE HTML
    ========================================================== */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================================================
       UNDO
    ========================================================== */

    function updateUndoButton() {

        const btn =
            document.getElementById('undo-btn');

        if (historyStack.length > 0) {

            btn.classList.remove(
                'opacity-0',
                'pointer-events-none',
                'translate-y-4'
            );

            btn.classList.add(
                'opacity-100',
                'pointer-events-auto',
                'translate-y-0'
            );

        } else {

            btn.classList.add(
                'opacity-0',
                'pointer-events-none',
                'translate-y-4'
            );

            btn.classList.remove(
                'opacity-100',
                'pointer-events-auto',
                'translate-y-0'
            );
        }
    }


    function executeWithUndo(actionFn) {

        const previousState =
            JSON.stringify(gameState);

        actionFn();

        const newState =
            JSON.stringify(gameState);

        if (previousState !== newState) {

            historyStack.push(previousState);

            if (historyStack.length > 30) {
                historyStack.shift();
            }

            updateUndoButton();
        }

        saveToLocalStorage();

        renderMatches();

        if (
            !document
                .getElementById('section-stats')
                .classList
                .contains('hidden')
        ) {
            renderStats();
            renderHistoricalStats();
        }
    }


    function undo() {

        if (historyStack.length === 0) {
            return;
        }

        const previousState =
            historyStack.pop();

        gameState =
            JSON.parse(previousState);

        saveToLocalStorage();

        renderMatches();
        renderStats();
        renderHistoricalStats();

        updateUndoButton();
    }


    /* =========================================================
       TABS
    ========================================================== */

    function switchTab(tab) {

        document
            .getElementById('section-play')
            .classList
            .toggle('hidden', tab !== 'play');

        document
            .getElementById('section-stats')
            .classList
            .toggle('hidden', tab !== 'stats');

        document
            .getElementById('tab-play')
            .className =
            tab === 'play'
                ? 'flex-1 py-2 font-semibold rounded-lg bg-emerald-700 text-white shadow-lg transition-all'
                : 'flex-1 py-2 font-semibold rounded-lg text-emerald-200 hover:bg-emerald-800 transition-all';

        document
            .getElementById('tab-stats')
            .className =
            tab === 'stats'
                ? 'flex-1 py-2 font-semibold rounded-lg bg-emerald-700 text-white shadow-lg transition-all'
                : 'flex-1 py-2 font-semibold rounded-lg text-emerald-200 hover:bg-emerald-800 transition-all';

        if (tab === 'stats') {

            renderStats();
            renderHistoricalStats();
        }
    }


    /* =========================================================
       NUEVA PARTIDA
    ========================================================== */

    function startMatch() {

        const p1 =
            document.getElementById('p1')
                .value
                .trim();

        const p2 =
            document.getElementById('p2')
                .value
                .trim();

        if (!p1 || !p2) {

            showModal(
                "Debes ingresar nombres para ambos jugadores.",
                "alert"
            );

            return;
        }

        if (p1 === p2) {

            showModal(
                "Los jugadores deben ser distintos.",
                "alert"
            );

            return;
        }

        const p1Existe =
            gameState.knownPlayers.includes(p1);

        const p2Existe =
            gameState.knownPlayers.includes(p2);

        if (!p1Existe || !p2Existe) {

            const nuevos = [];

            if (!p1Existe) nuevos.push(p1);
            if (!p2Existe) nuevos.push(p2);

            showModal(
                `¿Confirmar nuevos jugadores?<br><br>${nuevos.join(' y ')}`,
                "confirm",
                () => procesarInicioMatch(p1, p2),
                "Sí, Iniciar",
                "Cancelar"
            );

        } else {

            procesarInicioMatch(p1, p2);
        }
    }


    function procesarInicioMatch(p1, p2) {

        const activePlayers =
            gameState.activeMatches.flatMap(
                m => [m.p1, m.p2]
            );

        if (
            activePlayers.includes(p1) ||
            activePlayers.includes(p2)
        ) {

            showModal(
                "Uno o ambos jugadores ya están jugando en una partida activa.",
                "alert"
            );

            return;
        }

        executeWithUndo(() => {

            if (!gameState.knownPlayers.includes(p1)) {
                gameState.knownPlayers.push(p1);
            }

            if (!gameState.knownPlayers.includes(p2)) {
                gameState.knownPlayers.push(p2);
            }

            gameState.activeMatches.push({

                id: Date.now(),

                p1,
                p2,

                score1: 0,
                score2: 0,

                currentPica1: 0,
                currentPica2: 0,

                picas: [],
                chicos: []
            });
        });

        document.getElementById('p1').value = '';
        document.getElementById('p2').value = '';

        updateDatalists();
    }


    /* =========================================================
       PUNTUACIÓN
    ========================================================== */

    function updateScore(matchId, playerIdx, delta) {

        executeWithUndo(() => {

            const match =
                gameState.activeMatches
                    .find(m => m.id === matchId);

            if (!match) return;

            if (playerIdx === 1) {

                match.score1 =
                    Math.max(
                        0,
                        match.score1 + delta
                    );

                match.currentPica1 =
                    Math.max(
                        0,
                        match.currentPica1 + delta
                    );

            } else {

                match.score2 =
                    Math.max(
                        0,
                        match.score2 + delta
                    );

                match.currentPica2 =
                    Math.max(
                        0,
                        match.currentPica2 + delta
                    );
            }
        });
    }


    /* =========================================================
       REGISTRAR PICA
    ========================================================== */

    function registrarPica(matchId) {

        vibrarFuerte();

        executeWithUndo(() => {

            const match =
                gameState.activeMatches
                    .find(m => m.id === matchId);

            if (!match) return;

            match.picas.push({
                s1: match.currentPica1,
                s2: match.currentPica2
            });

            match.currentPica1 = 0;
            match.currentPica2 = 0;
        });
    }


    /* =========================================================
       CERRAR CHICOS
    ========================================================== */

    function cerrarTodosLosChicos() {

        vibrarFuerte();

        executeWithUndo(() => {

            gameState.activeMatches.forEach(match => {

                if (!match.chicos) {
                    match.chicos = [];
                }

                if (
                    match.picas &&
                    match.picas.length > 0
                ) {

                    match.chicos.push(
                        [...match.picas]
                    );

                    match.picas = [];
                }
            });
        });
    }

    ========================================================== */

    /* =========================================================
       TOTALES
    ========================================================== */

    function getTotals() {

        const totals = {};

        gameState.activeMatches.forEach(m => {

            if (!totals[m.p1]) {
                totals[m.p1] = {
                    won: 0,
                    lost: 0
                };
            }

            if (!totals[m.p2]) {
                totals[m.p2] = {
                    won: 0,
                    lost: 0
                };
            }

            totals[m.p1].won += m.score1;
            totals[m.p1].lost += m.score2;

            totals[m.p2].won += m.score2;
            totals[m.p2].lost += m.score1;
        });

        return totals;
    }

    /* =========================================================
       EDITAR TEXTO
    ========================================================== */

    function makeEditable(
        element,
        callback,
        numeric = false
    ) {

        if (!editMode) return;

        element.contentEditable = "true";

        element.classList.add(
            'editable-field',
            'edit-mode'
        );

        element.focus();

        const finish = () => {

            element.contentEditable = "false";

            element.classList.remove(
                'editable-field',
                'edit-mode'
            );

            callback(
                element.innerText.trim()
            );
        };

        element.addEventListener(
            'blur',
            finish,
            { once: true }
        );

        element.addEventListener(
            'keydown',
            e => {

                if (e.key === 'Enter') {

                    e.preventDefault();

                    element.blur();
                }
            }
        );
    }


    /* =========================================================
       EDITAR JUGADOR EN PARTIDA
    ========================================================== */

    function editCurrentPlayer(
        matchId,
        playerIndex,
        element
    ) {

        if (!editMode) return;

        const match =
            gameState.activeMatches.find(
                m => m.id === matchId
            );

        if (!match) return;

        const oldName =
            playerIndex === 1
                ? match.p1
                : match.p2;

        const newName =
            prompt(
                "Nuevo nombre del jugador:",
                oldName
            );

        if (!newName) return;

        const cleanName =
            newName.trim();

        if (!cleanName) return;

        if (playerIndex === 1) {
            match.p1 = cleanName;
        } else {
            match.p2 = cleanName;
        }

        if (!gameState.knownPlayers.includes(cleanName)) {
            gameState.knownPlayers.push(cleanName);
        }

        saveToLocalStorage();

        renderMatches();
        renderStats();
        renderHistoricalStats();

       EDITAR RESULTADO DE PARTIDA
    ========================================================== */

    function editMatchScore(
        matchId,
        playerIndex
    ) {

        if (!editMode) return;

        const match =
            gameState.activeMatches.find(
                m => m.id === matchId
            );

        if (!match) return;

        const oldValue =
            playerIndex === 1
                ? match.score1
                : match.score2;

        const value =
            prompt(

                oldValue
            );

        ) {

            match.score1 = number;
        } else {

        }

        saveToLocalStorage();

        renderMatches();
        renderStats();
    }


    /* =========================================================
       EDITAR ESTADÍSTICAS DE ESTA NOCHE
    ========================================================== */

    function editNightStat(
        playerName,
        field
    ) {

        if (!editMode) return;

        const totals =
            getTotals();

        if (!totals[playerName]) return;

        const oldValue =
            totals[playerName][field];

        const value =
            prompt(
                `Modificar ${field === 'won' ? 'G' : 'P'} de ${playerName}:`,
                oldValue
            );

        if (value === null) return;

        const number =
            parseInt(value, 10);

        if (
            Number.isNaN(number) ||
            number < 0
        ) {

            showModal(
                "Introduce un número válido.",
                "alert"
            );

            return;
        }

        /*
         * Las estadísticas de la noche se calculan
         * automáticamente a partir de las partidas.
         *
         * Por tanto, si quieres modificar G/P desde
         * esta pantalla, ajustamos las partidas para
         * conseguir el nuevo valor.
         */

        adjustPlayerTotal(
            playerName,
            field,
            number
        );
    }


    function adjustPlayerTotal(
        playerName,
        field,
        target
    ) {

        const matches =
            gameState.activeMatches.filter(
                m =>
                    m.p1 === playerName ||
                    m.p2 === playerName
            );

        if (matches.length === 0) {
            return;
        }

        let current = 0;

        matches.forEach(m => {

            if (m.p1 === playerName) {

                current +=
                    field === 'won'
                        ? m.score1
                        : m.score2;

            } else {

                current +=
                    field === 'won'
                        ? m.score2
                        : m.score1;
            }
        });

        const difference =
            target - current;

        if (difference === 0) return;

        /*
         * Modificamos la última partida del jugador.
         */

        const match =
            matches[matches.length - 1];

        if (match.p1 === playerName) {

            if (field === 'won') {

                match.score1 =
                    Math.max(
                        0,
                        match.score1 + difference
                    );

            } else {

                match.score2 =
                    Math.max(
                        0,
                        match.score2 + difference
                    );
            }

        } else {

            if (field === 'won') {

                match.score2 =
                    Math.max(
                        0,
                        match.score2 + difference
                    );

            } else {

                match.score1 =
                    Math.max(
                        0,
                        match.score1 + difference
                    );
            }
        }

        saveToLocalStorage();

        renderMatches();
        renderStats();
    }


    /* =========================================================

            getTotals();

        const listCombined =
            document.getElementById(
                'stats-list-combined'
            );

        const sortedPlayers =
            Object.keys(totals).sort((a, b) => {

                const diffA =
                    totals[a].won -
                    totals[a].lost;

                const diffB =
                    totals[b].won -
                    totals[b].lost;

                return (
                    diffB - diffA ||
                    totals[b].won -
                    totals[a].won ||
                    a.localeCompare(b)
                );
            });


        if (sortedPlayers.length === 0) {

            listCombined.innerHTML =
                `<div class="text-center text-emerald-500/70 text-xs py-4">

    /* =========================================================
       EDITAR NOMBRE DESDE RANKING
    ========================================================== */

    function editPlayerNameFromStats(oldName) {

        if (!editMode) return;

        const newName =
            prompt(
                "Nuevo nombre del jugador:",
                oldName
            );

        if (newName === null) return;

        const clean =
            newName.trim();

        if (!clean || clean === oldName) {
            return;
        }

        executeWithUndo(() => {

            gameState.activeMatches.forEach(m => {

                if (m.p1 === oldName) {
                    m.p1 = clean;
                }

                if (m.p2 === oldName) {
                    m.p2 = clean;
                }
            });

            if (
                gameState.knownPlayers.includes(oldName)
            ) {

                gameState.knownPlayers =
                    gameState.knownPlayers.map(
                        p =>
                            p === oldName
                                ? clean
                                : p
                    );
            }

        });
    }


    function escapeJs(value) {

        return String(value)
            .replace(/\\/g, '\\\\')
            .replace(/'/g, "\\'");
    }


    /* =========================================================
       HISTÓRICO
    ========================================================== */

    function confirmarRegistroNoche() {

        const currentTotals =
            getTotals();

        if (
            Object.keys(currentTotals).length === 0
        ) {

            showModal(
                "No hay datos en la noche actual para registrar.",
                "alert"
            );

            return;
        }

        showModal(
            "¿Seguro que quieres sumar los puntos actuales a la Tabla Histórica Anual?<br><br>Asegúrate de hacerlo solo al finalizar la noche.",
            "confirm",
            () => {

                for (
                    const player in currentTotals
                ) {

                    if (!historicalStats[player]) {

                        historicalStats[player] = {
                            won: 0,
                            lost: 0,
                            isBA: false
                        };
                    }

                    historicalStats[player].won +=
                        currentTotals[player].won;

                    historicalStats[player].lost +=
                        currentTotals[player].lost;
                }

                saveToLocalStorage();

                renderHistoricalStats();

                showModal(
                    "¡Noche registrada exitosamente en el histórico!",
                    "alert"
                );

            },
            "Sí, Registrar Noche",
            "Cancelar"
        );
    }


    /* =========================================================
       EDITAR HISTÓRICO
    ========================================================== */

    function editHistoricalPlayerName(oldName) {

        if (!editMode) return;

        const newName =
            prompt(
                "Nuevo nombre del jugador:",
                oldName
            );

        if (newName === null) return;

        const clean =
            newName.trim();

        if (!clean || clean === oldName) {
            return;
        }

        executeHistoricalEdit(() => {

            historicalStats[clean] =
                historicalStats[oldName];

            delete historicalStats[oldName];
        });
    }


    function editHistoricalStat(
        playerName,
        field
    ) {

        if (!editMode) return;

        const player =
            historicalStats[playerName];

        if (!player) return;

        const oldValue =
            player[field];

        const value =
            prompt(
                `Modificar ${field === 'won' ? 'G' : 'P'} de ${playerName}:`,
                oldValue
            );

        if (value === null) return;

        const number =
            parseInt(value, 10);

        if (
            Number.isNaN(number) ||
            number < 0
        ) {

            showModal(
                "Introduce un número válido.",
                "alert"
            );

            return;
        }

        executeHistoricalEdit(() => {

            player[field] = number;
        });
    }


    function editHistoricalBA(playerName) {

        if (!editMode) return;

        const player =
            historicalStats[playerName];

        if (!player) return;

        executeHistoricalEdit(() => {

            player.isBA =
                !player.isBA;
        });
    }


    function executeHistoricalEdit(
        callback
    ) {

        const before =
            JSON.stringify(historicalStats);

        callback();

        const after =
            JSON.stringify(historicalStats);

        if (before !== after) {

            saveToLocalStorage();

            renderHistoricalStats();
        }
    }


    /* =========================================================
       RENDER HISTÓRICO
    ========================================================== */

    function renderHistoricalStats() {

        const listCombined =
            document.getElementById(
                'historical-stats-list'
            );

        const sortedPlayers =
            Object.keys(historicalStats)
                .sort((a, b) => {

                    const isBaA =
                        historicalStats[a].isBA
                            ? 1
                            : 0;

                    const isBaB =
                        historicalStats[b].isBA
                            ? 1
                            : 0;

                    if (isBaA !== isBaB) {
                        return isBaA - isBaB;
                    }

                    const diffA =
                        historicalStats[a].won -
                        historicalStats[a].lost;

                    const diffB =
                        historicalStats[b].won -
                        historicalStats[b].lost;

                    return (
                        diffB - diffA ||
                        historicalStats[b].won -
                        historicalStats[a].won ||
                        a.localeCompare(b)
                    );
                });


        if (sortedPlayers.length === 0) {

            listCombined.innerHTML =
                `<div class="text-center text-emerald-500/50 text-xs py-4">
                    Aún no hay noches registradas
                </div>`;

            return;
        }


        listCombined.innerHTML =
            sortedPlayers.map(
                (name, index) => {

                    const player =
                        historicalStats[name];

                    const won =
                        player.won;

                    const lost =
                        player.lost;

                    const isBA =
                        player.isBA;

                    const diff =
                        won - lost;

                    const diffSign =
                        diff > 0
                            ? '+'
                            : '';


                    const bgClass =
                        isBA
                            ? 'bg-gray-800/80 border-gray-700/50 opacity-80'
                            : 'bg-[#022c22] border-emerald-800/70';

                    const rankColor =
                        isBA
                            ? 'text-gray-500'
                            : 'text-amber-600';

                    const nameColor =
                        isBA
                            ? 'text-gray-400'
                            : 'text-emerald-50';

                    const numColorWon =
                        isBA
                            ? 'text-gray-500'
                            : 'text-amber-500/90';

                    const numColorLost =
                        isBA
                            ? 'text-gray-500'
                            : 'text-red-500/90';

                    const diffColor =
                        isBA
                            ? 'text-gray-400'
                            : diff > 0
                                ? 'text-emerald-400'
                                : diff < 0
                                    ? 'text-red-400'
                                    : 'text-gray-500';


                    const nameDisplay =
                        isBA
                            ? `${escapeHtml(name)} <span class="ba-label">(BA)</span>`
                            : escapeHtml(name);


                    return `
                    <div
                        class="historical-row flex justify-between items-center ${bgClass} border rounded-md px-2 py-1.5 mb-1 shadow-sm select-none cursor-pointer"
                    >

                        <div class="flex items-center flex-1 min-w-0">

                            <span class="${rankColor} font-black text-xs w-5 shrink-0">
                                ${index + 1}.
                            </span>

                            <span
                                class="${nameColor} font-bold text-xs break-words pr-1 ${editMode ? 'editable-field' : ''}"
                                ${editMode ? `onclick="editHistoricalPlayerName('${escapeJs(name)}')"` : ''}
                            >
                                ${nameDisplay}
                            </span>

                        </div>


                        <div class="flex w-24 justify-between items-center text-center shrink-0">

                            <span
                                class="${numColorWon} font-bold text-xs w-6 ${editMode ? 'editable-field' : ''}"
                                ${editMode ? `onclick="editHistoricalStat('${escapeJs(name)}','won')"` : ''}
                            >
                                ${won}
                            </span>

                            <span
                                class="${numColorLost} font-bold text-xs w-6 ${editMode ? 'editable-field' : ''}"
                                ${editMode ? `onclick="editHistoricalStat('${escapeJs(name)}','lost')"` : ''}
                            >
                                ${lost}
                            </span>

                            <span
                                class="${diffColor} font-black text-xs w-8 bg-black/20 rounded py-0.5"
                            >
                                ${diffSign}${diff}
                            </span>

                        </div>

                    </div>
                    `;

                }
            ).join('');
    }


    /* =========================================================
       COMPARTIR NOCHE
    ========================================================== */

    function shareStats() {

        renderStats();

        setTimeout(() => {

            html2canvas(
                document.getElementById(
                    "capture-area"
                ),
                {
                    backgroundColor: "#064e3b",
                    scale: 2,
                    useCORS: true
                }
            ).then(canvas => {

                canvas.toBlob(blob => {

                    const file =
                        new File(
                            [blob],
                            'resultados_pica_pica.png',
                            {
                                type: 'image/png'
                            }
                        );

                    const shareData = {
                        title: 'Resultados Pica Pica',
                        files: [file]
                    };

                    if (
                        navigator.canShare &&
                        navigator.canShare({
                            files: [file]
                        })
                    ) {

                        navigator.share(
                            shareData
                        ).catch(
                            console.error
                        );

                    } else {

                        const link =
                            document.createElement('a');

                        link.download =
                            'resultados_pica_pica.png';

                        link.href =
                            canvas.toDataURL(
                                "image/png"
                            );

                        link.click();
                    }

                }, 'image/png');

            });

        }, 50);
    }


    /* =========================================================
       COMPARTIR HISTÓRICO
    ========================================================== */

    function shareHistoricalStats() {

        renderHistoricalStats();

        setTimeout(() => {

            html2canvas(
                document.getElementById(
                    "capture-area-history"
                ),
                {
                    backgroundColor: "#064e3b",
                    scale: 2,
                    useCORS: true,

                    onclone: clonedDoc => {

                        const rows =
                            clonedDoc.querySelectorAll(
                                '#historical-stats-list .historical-row'
                            );

                        rows.forEach(row => {

                            row.style.height = '40px';
                            row.style.minHeight = '40px';
                            row.style.boxSizing = 'border-box';
                            row.style.paddingTop = '0';
                            row.style.paddingBottom = '0';
                            row.style.display = 'flex';
                            row.style.alignItems = 'center';

                            const left =
                                row.children[0];

                            const stats =
                                row.children[1];

                            if (left) {

                                left.style.height = '40px';
                                left.style.display = 'flex';
                                left.style.alignItems = 'center';
                            }

                            if (stats) {

                                stats.style.height = '40px';
                                stats.style.display = 'flex';
                                stats.style.alignItems = 'center';
                            }

                            row.querySelectorAll(
                                ':scope > div:first-child > span'
                            ).forEach(el => {

                                el.style.display = 'flex';
                                el.style.alignItems = 'center';
                                el.style.height = '40px';
                                el.style.lineHeight = '1';
                            });

                            row.querySelectorAll(
                                ':scope > div:last-child > span'
                            ).forEach(el => {

                                el.style.display = 'flex';
                                el.style.alignItems = 'center';
                                el.style.justifyContent = 'center';
                                el.style.height = '40px';
                                el.style.lineHeight = '1';
                            });

                            const diff =
                                row.querySelector(
                                    ':scope > div:last-child > span:last-child'
                                );

                            if (diff) {

                                diff.style.height = '32px';
                                diff.style.alignSelf = 'center';
                            }

                            const ba =
                                row.querySelector(
                                    '.ba-label'
                                );

                            if (ba) {

                                ba.style.display = 'inline';
                                ba.style.position = 'static';
                                ba.style.transform = 'none';
                                ba.style.top = 'auto';
                                ba.style.bottom = 'auto';
                                ba.style.marginTop = '0';
                                ba.style.marginBottom = '0';
                                ba.style.padding = '0';
                                ba.style.border = '0';
                                ba.style.lineHeight = '1';
                                ba.style.verticalAlign = 'baseline';
                            }
                        });
                    }
                }
            ).then(canvas => {

                canvas.toBlob(blob => {

                    const file =
                        new File(
                            [blob],
                            'historico_pica_pica.png',
                            {
                                type: 'image/png'
                            }
                        );

                    const shareData = {
                        title: 'Histórico Pica Pica',
                        files: [file]
                    };

                    if (
                        navigator.canShare &&
                        navigator.canShare({
                            files: [file]
                        })
                    ) {

                        navigator.share(
                            shareData
                        ).catch(
                            console.error
                        );

                    } else {

                        const link =
                            document.createElement('a');

                        link.download =
                            'historico_pica_pica.png';

                        link.href =
                            canvas.toDataURL(
                                "image/png"
                            );

                        link.click();
                    }

                }, 'image/png');

            });

        }, 50);
    }


    /* =========================================================
       INICIO
    ========================================================== */

    loadFromLocalStorage();

</script>
